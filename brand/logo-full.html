<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<title>FreeAnalyst logo（透明背景渲染页）</title>
<!--
  这个文件只做一件事：**把网页页头原样渲染成一张透明底的 logo 图**。

  为什么要单独一页而不是截屏网页：网页有导航、语言切换、背景色，
  截出来带一堆不该进 logo 的东西。

  规格全部照抄 webapp_page.html 的页头（改那边要同步这里）：
    算盘   viewBox 0 0 19 33 → 高 48px、宽 = 48 × 19/33 = 27.64px
            上金 #E9B949 · 下银 #C9D2DC · 红 #E5484D（左起第 1 列 · 上排第 2 颗）
    间距   16px
    字标   33px / 700 / letter-spacing .24em；FREE 用 #D7F5E9、ANALYST 用 #00E5A0
    署名   11px / letter-spacing .14em / #42565A
    对位   字标贴算盘顶、署名贴算盘底（stretch + space-between）

  **刻意不带光晕**：网页上算盘有 drop-shadow、ANALYST 有 text-shadow 的辉光，
  那是屏幕上的效果；logo 资产要干净 —— 辉光放在白底上会脏。
-->
<style>
  html,body{margin:0;padding:0;background:transparent}
  /* 固定画布，内容居中：这样导出的 PNG 四周留白均匀，不用再裁 */
  body{width:360px;height:60px;display:flex;align-items:center;justify-content:center;
       overflow:hidden}
  .top{display:flex;gap:16px;align-items:center}
  .logo{flex:0 0 auto;height:48px;width:calc(48px * 19 / 33)}
  .logo .lg-up{fill:#E9B949}
  .logo .lg-down{fill:#C9D2DC}
  .logo .lg-acc{fill:#E5484D}
  .head-txt{flex:0 0 auto;align-self:stretch;display:flex;flex-direction:column;
            justify-content:space-between}
  .word{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,"Cascadia Mono",
        "PingFang SC",monospace;
        font-size:33px;font-weight:700;letter-spacing:.24em;margin:0;line-height:1;
        color:#D7F5E9;white-space:nowrap}
  .word em{font-style:normal;color:#00E5A0}
  .byline{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,"Cascadia Mono",
          "PingFang SC",monospace;
          color:#42565A;font-size:11px;letter-spacing:.14em;white-space:nowrap}
</style></head>
<body>
  <div class="top">
    <!-- 极简算盘：28 个方块（4 列 × 上 2 下 5），无轴无梁无框无高光 -->
    <svg class="logo" viewBox="0 0 19 33" shape-rendering="crispEdges" role="img" aria-label="算盘">
      <g class="lg-up">
        <rect x="2" y="2" width="3" height="3"/>
        <rect x="6" y="2" width="3" height="3"/>
        <rect x="10" y="2" width="3" height="3"/>
        <rect x="14" y="2" width="3" height="3"/>
        <rect x="6" y="6" width="3" height="3"/>
        <rect x="10" y="6" width="3" height="3"/>
        <rect x="14" y="6" width="3" height="3"/>
      </g>
      <g class="lg-down">
        <rect x="2" y="12" width="3" height="3"/>
        <rect x="6" y="12" width="3" height="3"/>
        <rect x="10" y="12" width="3" height="3"/>
        <rect x="14" y="12" width="3" height="3"/>
        <rect x="2" y="16" width="3" height="3"/>
        <rect x="6" y="16" width="3" height="3"/>
        <rect x="10" y="16" width="3" height="3"/>
        <rect x="14" y="16" width="3" height="3"/>
        <rect x="2" y="20" width="3" height="3"/>
        <rect x="6" y="20" width="3" height="3"/>
        <rect x="10" y="20" width="3" height="3"/>
        <rect x="14" y="20" width="3" height="3"/>
        <rect x="2" y="24" width="3" height="3"/>
        <rect x="6" y="24" width="3" height="3"/>
        <rect x="10" y="24" width="3" height="3"/>
        <rect x="14" y="24" width="3" height="3"/>
        <rect x="2" y="28" width="3" height="3"/>
        <rect x="6" y="28" width="3" height="3"/>
        <rect x="10" y="28" width="3" height="3"/>
        <rect x="14" y="28" width="3" height="3"/>
      </g>
      <rect class="lg-acc" x="2" y="6" width="3" height="3"/>
    </svg>
    <div class="head-txt">
      <h1 class="word">FREE<em>ANALYST</em></h1>
      <div class="byline">by New Chapter Ventures</div>
    </div>
  </div>
</body></html>
