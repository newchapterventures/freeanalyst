<!DOCTYPE html>
<!--
  FreeAnalyst 本地估值向导 —— 页面正文。
  **这个文件既是线上那一页，也是设计稿**：webapp.py 直接读它、不改一个字，
  所以不存在「稿子和实现长得不一样」。

  ## 文案规范（正式金融用语，不要口语）
  统一用词：材料（materials）/ 标的（target）/ 报表识别（extraction）/
  勾稽校验（reconciliation）/ 口径（basis）/ 假设（assumptions）/ 结论（conclusion）。
  **不要**出现"丢材料""认材料""出报告"这类口语 —— 这是给专业读者看的界面。

  ## 双语
  静态文案走 `data-i18n` + 词表；JS 动态文案走 `t('key')`。
  手动切换（右上角），选择记在 localStorage。
  **已知限制（页面上照实标注）**：服务端产出的文本 —— 报表标签、勾稽项名称、
  假设清单的条目与报告正文 —— 目前只有中文。要真双语得在引擎层加词表，那是下一步。

  ## 配色
  青绿 #00E5A0 = 机器已完成并通过的　琥珀 #FFB000 = 需要人决定的　洋红 #FF2E63 = 异常
-->
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeAnalyst · 本地估值向导</title>
<!-- 标签页图标：极简算盘（28 个方块·上金下银·一颗红），内联成 data URI -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 19 33' shape-rendering='crispEdges'%3E%3Cg fill='%23E9B949'%3E%3Crect x='2' y='2' width='3' height='3'/%3E%3Crect x='6' y='2' width='3' height='3'/%3E%3Crect x='10' y='2' width='3' height='3'/%3E%3Crect x='14' y='2' width='3' height='3'/%3E%3Crect x='6' y='6' width='3' height='3'/%3E%3Crect x='10' y='6' width='3' height='3'/%3E%3Crect x='14' y='6' width='3' height='3'/%3E%3C/g%3E%3Cg fill='%23C9D2DC'%3E%3Crect x='2' y='12' width='3' height='3'/%3E%3Crect x='6' y='12' width='3' height='3'/%3E%3Crect x='10' y='12' width='3' height='3'/%3E%3Crect x='14' y='12' width='3' height='3'/%3E%3Crect x='2' y='16' width='3' height='3'/%3E%3Crect x='6' y='16' width='3' height='3'/%3E%3Crect x='10' y='16' width='3' height='3'/%3E%3Crect x='14' y='16' width='3' height='3'/%3E%3Crect x='2' y='20' width='3' height='3'/%3E%3Crect x='6' y='20' width='3' height='3'/%3E%3Crect x='10' y='20' width='3' height='3'/%3E%3Crect x='14' y='20' width='3' height='3'/%3E%3Crect x='2' y='24' width='3' height='3'/%3E%3Crect x='6' y='24' width='3' height='3'/%3E%3Crect x='10' y='24' width='3' height='3'/%3E%3Crect x='14' y='24' width='3' height='3'/%3E%3Crect x='2' y='28' width='3' height='3'/%3E%3Crect x='6' y='28' width='3' height='3'/%3E%3Crect x='10' y='28' width='3' height='3'/%3E%3Crect x='14' y='28' width='3' height='3'/%3E%3C/g%3E%3Crect fill='%23E5484D' x='2' y='6' width='3' height='3'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#05070A; --panel:#0A0F16; --panel2:#0D141C; --line:#16212B;
    --fg:#D7F5E9; --mut:#5F7C77; --pri:#00E5A0; --amber:#FFB000; --mag:#FF2E63;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,"Cascadia Mono","PingFang SC",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--fg); font:13px/1.65 var(--mono);
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(900px 420px at 12% -8%, rgba(0,229,160,.055), transparent 62%),
      radial-gradient(700px 380px at 96% 4%, rgba(255,176,0,.035), transparent 60%),
      linear-gradient(rgba(0,229,160,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,160,.028) 1px, transparent 1px);
    background-size:auto,auto,34px 34px,34px 34px;
  }
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.020) 0 1px, transparent 1px 3px);
    mix-blend-mode:screen}
  .wrap{max-width:1000px;margin:0 auto;padding:30px 24px 90px}

  /* ── 抬头 ── */
  .top{display:flex;gap:16px;align-items:center;margin-bottom:8px}
  .logo{flex:0 0 auto;transition:filter .25s ease, transform .25s ease;
        filter:drop-shadow(0 0 7px rgba(108,92,231,.40))}
  .logo:hover{filter:drop-shadow(0 0 15px rgba(255,194,75,.5));transform:translateY(-1px)}
  .logo .lg-up{fill:#E9B949}
  .logo .lg-down{fill:#C9D2DC}
  .logo .lg-acc{fill:#E5484D}
  .logo:hover .lg-up{fill:#F5CB6E}
  .logo:hover .lg-down{fill:#DDE5EC}
  .logo:hover .lg-acc{fill:#FF6A6E}
  .head-txt{flex:1 1 auto}
  .word{font-size:23px;font-weight:700;letter-spacing:.30em;margin:0;line-height:1.1}
  .word em{font-style:normal;color:var(--pri);text-shadow:0 0 12px rgba(0,229,160,.55)}
  .tag{color:var(--mut);font-size:12px;letter-spacing:.02em}

  /* ── 语言切换 ── */
  .lang{flex:0 0 auto;display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
  .lang button{background:transparent;border:0;color:var(--mut);font-family:var(--mono);
    font-size:11.5px;letter-spacing:.06em;padding:6px 12px;cursor:pointer;transition:all .16s ease}
  .lang button:hover{color:var(--fg)}
  .lang button.on{color:var(--pri);background:rgba(0,229,160,.10)}

  .prompt{color:var(--mut);font-size:12px;margin:12px 0 18px}
  .caret{display:inline-block;width:7px;height:13px;background:var(--pri);
         vertical-align:-2px;animation:blink 1.05s steps(1) infinite;margin-left:2px}
  @keyframes blink{50%{opacity:0}}
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .pill{border:1px solid var(--line);background:var(--panel);border-radius:2px;
        padding:4px 10px;font-size:11.5px;color:var(--mut);letter-spacing:.03em}
  .pill.on{color:var(--pri);border-color:rgba(0,229,160,.38)}
  .dot{display:inline-block;width:6px;height:6px;background:var(--pri);border-radius:50%;
       margin-right:6px;vertical-align:1px;box-shadow:0 0 8px var(--pri);
       animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.30}}

  /* ── 步骤条 ── */
  .steps{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 26px}
  .step{border:1px solid var(--line);background:var(--panel);border-radius:2px;
        padding:6px 12px;font-size:12px;color:var(--mut);display:flex;gap:8px;align-items:center;
        transition:color .18s ease,border-color .18s ease,box-shadow .18s ease}
  .step .n{opacity:.75;font-weight:700}
  .step.on{color:var(--pri);border-color:rgba(0,229,160,.42);
           box-shadow:0 0 0 1px rgba(0,229,160,.10), 0 0 20px rgba(0,229,160,.14)}
  .step.on .n{opacity:1}
  .step.off{opacity:.42;border-style:dashed}
  .step.off .n{text-decoration:line-through}

  /* ── 卡片 ── */
  .card{position:relative;background:linear-gradient(180deg,var(--panel),var(--panel2));
        border:1px solid var(--line);border-radius:3px;padding:18px 20px;margin-bottom:14px;
        transition:border-color .2s ease, box-shadow .2s ease}
  .card:hover{border-color:rgba(0,229,160,.28);box-shadow:0 0 26px rgba(0,229,160,.07)}
  .card::before,.card::after{content:"";position:absolute;width:11px;height:11px;
        border:1px solid var(--pri);opacity:0;transition:opacity .2s ease}
  .card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
  .card::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
  .card:hover::before,.card:hover::after{opacity:.85}
  .card h2{font-size:13.5px;margin:0 0 12px;letter-spacing:.04em;display:flex;
           align-items:baseline;gap:10px;flex-wrap:wrap}
  .card h2 .idx{color:var(--pri)}
  .card h2 small{color:var(--mut);font-weight:400;font-size:11.5px;letter-spacing:0}
  .card.need h2 .idx{color:var(--amber)}
  .card.bad h2 .idx{color:var(--mag)}

  input[type=text]{width:100%;background:#070C11;color:var(--fg);font-family:var(--mono);
    font-size:12.5px;padding:10px 12px;border:1px solid var(--line);border-radius:2px;
    transition:border-color .18s ease,box-shadow .18s ease}
  input[type=text]::placeholder{color:#3F5450}
  input[type=text]:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(0,229,160,.10)}
  button.act{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.05em;
    padding:10px 20px;border-radius:2px;cursor:pointer;transition:all .18s ease;
    background:transparent;color:var(--pri);border:1px solid var(--pri)}
  button.act:hover:not(:disabled){background:rgba(0,229,160,.12);box-shadow:0 0 20px rgba(0,229,160,.25)}
  button.act:disabled{opacity:.40;cursor:default}
  button.act.amber{color:var(--amber);border-color:var(--amber)}
  button.act.amber:hover:not(:disabled){background:rgba(255,176,0,.13);box-shadow:0 0 20px rgba(255,176,0,.25)}
  button.act.sm{font-size:11.5px;padding:6px 12px;font-weight:400;letter-spacing:.02em}
  button.act.ghost{color:var(--mut);border-color:var(--line)}
  button.act.ghost:hover:not(:disabled){color:var(--pri);border-color:var(--pri);
        background:rgba(0,229,160,.08);box-shadow:none}
  .pickrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:11px;
        border:1px dashed rgba(0,229,160,.22);border-radius:3px;padding:10px 12px;
        background:rgba(0,229,160,.035)}
  .pickrow .label{color:var(--pri);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  .pickrow .hint{color:var(--mut);font-size:11.5px;line-height:1.5}
  button.pick{font-family:var(--mono);font-size:12.5px;letter-spacing:.03em;
        padding:9px 16px;border-radius:2px;cursor:pointer;
        background:rgba(0,229,160,.10);color:var(--pri);
        border:1px solid rgba(0,229,160,.55);transition:all .18s ease}
  button.pick:hover:not(:disabled){background:rgba(0,229,160,.20);
        box-shadow:0 0 20px rgba(0,229,160,.28)}
  button.pick:disabled{opacity:.45;cursor:default;background:transparent;
        color:var(--mut);border-color:var(--line)}
  .card.drop{border-color:var(--pri);
        box-shadow:0 0 0 1px rgba(0,229,160,.25), 0 0 30px rgba(0,229,160,.16)}
  .grid2{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
  .grid3{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  tbody tr:nth-child(even){background:rgba(255,255,255,.014)}
  th{color:var(--mut);font-weight:400;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .ok{color:var(--pri)} .warn{color:var(--amber)} .bad{color:var(--mag)} .mut{color:var(--mut)}
  .kv{color:var(--mut);font-size:12.5px;line-height:1.9}
  .kv b{color:var(--fg);font-weight:400}

  h3.grp{font-size:11px;color:var(--amber);letter-spacing:.14em;text-transform:uppercase;
         margin:18px 0 6px;font-weight:400}
  .q{display:grid;grid-template-columns:minmax(200px,260px) 1fr;gap:12px;
     align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}
  .q:last-child{border-bottom:0}
  .q label{font-size:12.5px}
  .q .hint{display:block;color:var(--mut);font-size:11px;margin-top:3px;line-height:1.5}
  .q .hint b{color:var(--amber);font-weight:400}
  .q input{font-size:12px}

  .term{border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#04070A}
  .term .bar{display:flex;align-items:center;gap:9px;padding:7px 12px;
             background:var(--panel);border-bottom:1px solid var(--line);
             font-size:11px;color:var(--mut);letter-spacing:.05em}
  .term .bar .dots{display:flex;gap:5px}
  .term .bar i{width:7px;height:7px;border-radius:50%;background:#1F2A33;display:block}
  .term pre{margin:0;padding:15px;max-height:540px;overflow:auto;white-space:pre-wrap;
            font-family:var(--mono);font-size:11.5px;line-height:1.62;color:#BFE9DA}

  .notice{border:1px dashed rgba(255,176,0,.30);border-radius:3px;padding:11px 14px;
          color:var(--mut);font-size:12px;margin-bottom:14px;background:rgba(255,176,0,.025)}
  .notice b{color:var(--amber);font-weight:400}
  .notice.issue{border-color:rgba(255,46,99,.35);background:rgba(255,46,99,.03)}
  .notice.issue b{color:var(--mag)}
  .notice.quiet{border-color:var(--line);background:transparent}
  footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
         color:var(--mut);font-size:11.5px;line-height:2}
  footer span{color:var(--pri)}
  .hide{display:none}
  code{font-family:var(--mono);color:var(--amber);background:rgba(255,176,0,.07);
       padding:1px 5px;border-radius:2px}
</style></head><body><div class="wrap">

  <div class="top">
    <!-- 极简算盘：28 个方块（4 列 × 上 2 下 5），无轴无梁无框无高光。
         上金 #E9B949、下银 #C9D2DC，红块 #E5484D 在左起第 1 列 · 上排第 2 颗。 -->
    <svg class="logo" width="38" height="66" viewBox="0 0 19 33" shape-rendering="crispEdges"
         role="img" aria-label="算盘">
      <g class="lg-up">
        <rect x="2" y="2" width="3" height="3"/>
        <rect x="6" y="2" width="3" height="3"/>
        <rect x="10" y="2" width="3" height="3"/>
        <rect x="14" y="2" width="3" height="3"/>
        <rect x="6" y="6" width="3" height="3"/>
        <rect x="10" y="6" width="3" height="3"/>
        <rect x="14" y="6" width="3" height="3"/>
      </g>
      <g class="lg-down">
        <rect x="2" y="12" width="3" height="3"/>
        <rect x="6" y="12" width="3" height="3"/>
        <rect x="10" y="12" width="3" height="3"/>
        <rect x="14" y="12" width="3" height="3"/>
        <rect x="2" y="16" width="3" height="3"/>
        <rect x="6" y="16" width="3" height="3"/>
        <rect x="10" y="16" width="3" height="3"/>
        <rect x="14" y="16" width="3" height="3"/>
        <rect x="2" y="20" width="3" height="3"/>
        <rect x="6" y="20" width="3" height="3"/>
        <rect x="10" y="20" width="3" height="3"/>
        <rect x="14" y="20" width="3" height="3"/>
        <rect x="2" y="24" width="3" height="3"/>
        <rect x="6" y="24" width="3" height="3"/>
        <rect x="10" y="24" width="3" height="3"/>
        <rect x="14" y="24" width="3" height="3"/>
        <rect x="2" y="28" width="3" height="3"/>
        <rect x="6" y="28" width="3" height="3"/>
        <rect x="10" y="28" width="3" height="3"/>
        <rect x="14" y="28" width="3" height="3"/>
      </g>
      <rect class="lg-acc" x="2" y="6" width="3" height="3"/>
    </svg>
    <div class="head-txt">
      <h1 class="word">FREE<em>ANALYST</em></h1>
      <div class="tag" data-i18n="tagline"></div>
    </div>
    <div class="lang" role="group">
      <button type="button" data-lang="zh">中文</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>

  <div class="prompt">$ freeanalyst --local --no-egress<span class="caret"></span></div>

  <div class="pills">
    <span class="pill on"><span class="dot"></span>LOCAL · 127.0.0.1</span>
    <span class="pill" data-i18n="pill.egress"></span>
    <span class="pill" data-i18n="pill.arith"></span>
    <span class="pill" data-i18n="pill.declare"></span>
  </div>

  <div class="steps">
    <div class="step on" id="s1"><span class="n">01</span><span data-i18n="step.1"></span></div>
    <div class="step" id="s2"><span class="n">02</span><span data-i18n="step.2"></span></div>
    <div class="step off" id="s3"><span class="n">03</span><span data-i18n="step.3"></span></div>
    <div class="step off" id="s4"><span class="n">04</span><span data-i18n="step.4"></span></div>
    <div class="step" id="s5"><span class="n">05</span><span data-i18n="step.5"></span></div>
    <div class="step" id="s6"><span class="n">06</span><span data-i18n="step.6"></span></div>
  </div>

  <div class="notice" data-i18n-html="notice.scope"></div>

  <div class="notice issue hide" id="stale" data-i18n-html="stale.banner"></div>

  <div class="card">
    <h2><span class="idx">01</span><span data-i18n="s1.title"></span>
        <small data-i18n="s1.sub"></small></h2>
    <div class="grid2">
      <input type="text" id="path" spellcheck="false" data-i18n-ph="s1.ph">
      <div><button class="act" id="scanBtn" onclick="scan()" data-i18n="s1.btn"></button></div>
    </div>
    <div class="pickrow">
      <span class="label" data-i18n="s1.picklabel"></span>
      <button class="pick" id="pickDir" type="button" onclick="pick('dir')" data-i18n="s1.pickdir"></button>
      <button class="pick" id="pickFile" type="button" onclick="pick('file')" data-i18n="s1.pickfile"></button>
      <span class="hint" data-i18n="s1.drophint"></span>
    </div>
    <div id="scanMsg" class="mut" style="margin-top:10px;font-size:12px"></div>
  </div>

  <div class="card hide" id="card2">
    <h2><span class="idx">02</span><span data-i18n="s2.title"></span>
        <small data-i18n="s2.sub"></small></h2>
    <div id="tables"></div>
    <div id="checks" style="margin-top:14px"></div>
    <div id="meta" style="margin-top:14px"></div>
    <div id="unitBox" style="margin-top:14px"></div>
    <div id="srvNote" class="notice quiet hide" style="margin:14px 0 0" data-i18n="s2.srvnote"></div>
  </div>

  <div class="card need hide" id="card5">
    <h2><span class="idx">05</span><span data-i18n="s5.title"></span>
        <small data-i18n="s5.sub"></small></h2>
    <div class="notice" style="margin-bottom:14px" data-i18n-html="s5.notice"></div>
    <div id="questions"></div>
    <div style="margin-top:18px">
      <button class="act amber" id="goBtn" onclick="go()" data-i18n="s5.btn"></button>
    </div>
  </div>

  <div class="card hide" id="card6">
    <h2><span class="idx">06</span><span data-i18n="s6.title"></span>
        <small id="outDir"></small></h2>
    <div id="missing" style="margin-bottom:14px"></div>
    <div class="term">
      <div class="bar"><span class="dots"><i></i><i></i><i></i></span>
        <span data-i18n="s6.termbar"></span></div>
      <pre id="report"></pre>
    </div>
  </div>

  <footer>
    <span data-i18n="foot.title"></span><br>
    <span data-i18n="foot.1"></span><br>
    <span data-i18n="foot.2"></span><br>
    <span data-i18n="foot.3"></span>
  </footer>

  <div class="notice hide" id="demoTag" data-i18n-html="demo.tag" style="margin-bottom:0"></div>

<script>
// ─────────────────────────────  词表  ─────────────────────────────
// 静态文案走 data-i18n，动态文案走 t('key')。加新文案 = 两处各加一条。
const I18N = {
  zh: {
    "tagline": "本地估值向导 · 尽调材料 → 估值报告 · 全程不出网",
    "pill.egress": "零出境 · 机密材料仅在本机处理",
    "pill.arith": "算术由代码执行 · 不交由模型",
    "pill.declare": "输入缺失即声明 · 不作假设",
    "step.1": "载入材料", "step.2": "报表识别与勾稽校验",
    "step.3": "行业建议 · 未接入", "step.4": "可比公司 · 未接入",

  document.documentElement.lang = (lang === "en") ? "en" : "zh";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });

  document.querySelectorAll(".lang button").forEach(b => {
    b.classList.toggle("on", b.dataset.lang === lang);
  });
  if (STATE.data) rerender();          // 有数据时，表格/清单跟着换语言
}

function post(url, body){
  return fetch(url, {method:"POST", headers:{"Content-Type":"application/json"},
                     body: JSON.stringify(body)}).then(r => r.json());
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// 让服务去调系统原生选择框，拿真实路径 —— **不上传、不复制**（材料留在原地）
function pick(kind){
  if(DEMO_DONE){ $("scanMsg").innerHTML = t("demo.msg"); return; }
  $("scanMsg").innerHTML = '<span class="warn">' + t("s1.picking") + '</span>';
  post("/api/pick", {kind:kind}).then(d => {
    if(d.ok){
      $("path").value = d.path;
      $("scanMsg").innerHTML = '<span class="ok">' + esc(d.path) + '</span>';
    } else if(d.cancelled){
      $("scanMsg").innerHTML = '<span class="mut">' + t("s1.cancelled") + '</span>';
    } else {
      $("scanMsg").innerHTML = '<span class="bad">' + esc(d.error || t("err.fail")) + '</span>';
    }
  }).catch(e => {
    $("scanMsg").innerHTML = '<span class="bad">' + esc(String(e)) + '</span>';
  });
}

// 从访达拖进来：浏览器会在 dataTransfer 里给 file:/// 开头的 URL，那就是真实路径，
// 所以这条路同样**不上传、不复制**。取不到路径就明说，不假装成功。
function wireDrop(){
  const card = $("path").closest(".card");
  if(!card) return;
  ["dragenter", "dragover"].forEach(ev => card.addEventListener(ev, e => {
    e.preventDefault();
    if(e.dataTransfer) e.dataTransfer.dropEffect = "copy";
    card.classList.add("drop");
  }));
  ["dragleave", "dragend"].forEach(ev =>
    card.addEventListener(ev, () => card.classList.remove("drop")));
  card.addEventListener("drop", e => {
    e.preventDefault();
    card.classList.remove("drop");
    const dt = e.dataTransfer;
    if(!dt) return;
    let p = dt.getData("text/uri-list") || dt.getData("text/plain") || "";
    p = p.split("\n").map(s => s.trim()).filter(s => s && s.charAt(0) !== "#")[0] || "";
    if(p.indexOf("file://") === 0){
      try { p = decodeURIComponent(p.replace(/^file:\/\/(localhost)?/, "")); } catch(_){}
    }
    p = p.replace(/\/+$/, "") || "/";
    if(p.charAt(0) === "/"){
      $("path").value = p;
      $("scanMsg").innerHTML = '<span class="ok">' + esc(p) + '</span>';
    } else {
      $("scanMsg").innerHTML = '<span class="bad">' + t("s1.dropped") + '</span>';
    }
  });
}

function scan(){
  if(DEMO_DONE){
    $("scanMsg").innerHTML = t("demo.msg");
    return;
  }
  const p = $("path").value.trim();
  if(!p){ $("scanMsg").textContent = t("s1.needpath"); return; }
  $("scanBtn").disabled = true;
  $("scanMsg").innerHTML = t("s1.running");
  post("/api/scan", {path:p, unit:STATE.unit}).then(d => {
    $("scanBtn").disabled = false;
    if(!d.ok){
      $("scanMsg").innerHTML = '<span class="bad">' + esc(d.error || t("err.fail")) + '</span>';
      if(d.tables){ renderTables(d); renderMeta(d); $("card2").classList.remove("hide"); }
      return;
    }
    STATE.path = d.path;
    STATE.data = d;
    $("scanMsg").innerHTML = t("s1.ok") + ' <span class="mut">· ' + esc(d.label) + '</span>';
    rerender();
    $("s2").className = "step on";
    $("s5").className = "step need on";
    $("s6").className = "step on";
    $("card2").classList.remove("hide");
    $("card5").classList.remove("hide");
    $("srvNote").classList.remove("hide");
    $("card2").scrollIntoView({behavior:"smooth", block:"start"});
  }).catch(e => {
    $("scanBtn").disabled = false;
    $("scanMsg").innerHTML = '<span class="bad">' + esc(String(e)) + '</span>';
  });
}

function rerender(){
  const d = STATE.data;
  if(!d) return;
  renderTables(d); renderChecks(d); renderMeta(d); renderUnit(d); renderQuestions(d);
}

function renderTables(d){
  let h = '<table><thead><tr><th>' + t("th.statement") + '</th><th>' + t("th.source") +
          '</th><th class="num">' + t("th.mapped") + '</th><th>' + t("th.status") +
          '</th></tr></thead><tbody>';
  for(const x of d.tables){
    h += '<tr><td>' + esc(x.label) + '</td><td class="mut">' + esc(x.file || "—") + '</td>' +
         '<td class="num mut">' + (x.rows ? x.mapped + " / " + x.rows : "—") + '</td>' +
         '<td>' + (x.found ? '<span class="ok">■ ' + t("st.found") + '</span>'
                           : '<span class="bad">■ ' + t("st.missing") + '</span>') + '</td></tr>';
  }
  h += '</tbody></table>';
  if(d.unused && d.unused.length){
    h += '<div class="notice" style="margin:12px 0 0"><b>' + t("unused.head") + '</b><br>' +
         d.unused.map(u => "· " + esc(u)).join("<br>") + '</div>';
  }
  $("tables").innerHTML = h;
}

function renderChecks(d){
  let h = '<table><thead><tr><th>' + t("chk.head") + '</th><th>' + t("chk.result") +
          '</th></tr></thead><tbody>';
  for(const c of d.checks){
    const v = c.ok === true ? '<span class="ok">■ ' + t("chk.ok") + '</span>'
            : c.ok === false ? '<span class="bad">■ ' + t("chk.bad") + '</span>'
            : c.applicable ? '<span class="warn">■ ' + t("chk.na") + '</span>'
            : '<span class="mut">■ ' + t("chk.nr") + '</span>';
    h += '<tr><td>' + esc(c.name) + '</td><td>' + v + '</td></tr>';
  }
  h += '</tbody></table>';
  const dups = (d.warnings || []).filter(w => w.indexOf("个取值") >= 0).length;
  if(dups) h += '<div class="notice issue" style="margin-top:12px">' +
                esc(t("chk.dups").replace("{n}", dups)) + '</div>';
  $("checks").innerHTML = h;
}

function renderMeta(d){
  $("meta").innerHTML =
    '<div class="kv">' + t("meta.basis") + '：<b>' + esc(d.gaap || "—") + '</b> · <b>' +
    esc(d.scope || "—") + '</b> · <b>' + esc(d.audited || "—") + '</b>　｜　' +
    t("meta.period") + ' <b>' + esc(d.period || "—") + '</b> <span class="mut">（' +
    t("meta.fix") + '）</span></div>' +
    (d.notes && d.notes.length
      ? '<div class="kv mut" style="margin-top:8px">' +
        d.notes.map(n => "· " + esc(n)).join("<br>") + '</div>' : '');
}

function renderUnit(d){
  $("unitBox").innerHTML =
    '<div class="grid3"><div><label class="kv">' + t("unit.label") +
    ' <b class="warn">' + t("unit.warn") + '</b></label>' +
    '<input type="text" id="unit" value="' + esc(d.unit || "") +
    '" placeholder="元 / 千元 / 万元 / 千美元 / RMB / RMB thous. / USD thous."></div>' +
    '<div class="kv" style="align-self:end">' +
    (d.unit ? t("unit.basis") + esc(d.unit_basis || "")
            : '<span class="bad">■ ' + t("unit.unknown") + '</span>') +
    '</div></div>';
}

function renderQuestions(d){
  let g = "", h = "";
  for(const q of d.questions){
    if(q.group !== g){ g = q.group; h += '<h3 class="grp">' + esc(g) + '</h3>'; }
    const ref = q.reference ? '　｜ <b>参考 / ref</b>：' + esc(q.reference) : "";
    h += '<div class="q"><label>' + esc(q.label) + '<span class="hint">' + esc(q.hint || "") +
         ref + '</span></label><input type="text" spellcheck="false" data-key="' +
         esc(q.key) + '" value="' + esc(q.default || "") + '"></div>';
  }
  $("questions").innerHTML = h;
}

function go(){
  if(DEMO_DONE){
    $("missing").innerHTML = '<div class="notice">' + t("demo.go") + '</div>';
    $("card6").classList.remove("hide");
    $("card6").scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
  $("goBtn").disabled = true;
  const answers = {};
  document.querySelectorAll("#questions input").forEach(i => {
    if(i.value.trim()) answers[i.dataset.key] = i.value.trim();
  });
  const u = $("unit") ? $("unit").value.trim() : "";
  post("/api/appraise", {path:STATE.path, unit:u, answers:answers}).then(d => {
    $("goBtn").disabled = false;
    $("card6").classList.remove("hide");
    if(!d.ok){
      $("missing").innerHTML = '<div class="notice issue"><b>' + esc(d.error || t("err.fail")) +
                               '</b></div>';
      $("report").textContent = "";
      $("card6").scrollIntoView({behavior:"smooth"});
      return;
    }
    $("outDir").textContent = t("out.prefix") + d.out_dir;
    $("missing").innerHTML = d.missing.length
      ? '<div class="notice"><b>' + t("miss.head") + '</b><br>' +
        d.missing.map(x => "· " + esc(x)).join("<br>") + '</div>' : "";
    $("report").textContent = d.report;
    $("card6").scrollIntoView({behavior:"smooth", block:"start"});
  }).catch(e => {
    $("goBtn").disabled = false;
    $("missing").innerHTML = '<div class="notice issue">' + esc(String(e)) + '</div>';
  });
}

// 服务是旧进程时，说清楚「为什么」和「怎么办」——
// 不让用户对着 `unknown endpoint` 猜（这个坑真踩过：页面更新了、服务没重启）。
function showStale(){
  $("stale").classList.remove("hide");
  ["pickDir", "pickFile"].forEach(id => {
    const el = $(id);
    if(el) el.disabled = true;
  });
}

// ── 启动：有后端就等人操作；没后端（双击打开、聊天里预览）自动进设计预览 ──
function boot(){
  applyLang(LANG);
  wireDrop();
  document.querySelectorAll(".lang button").forEach(b => {
    b.addEventListener("click", () => applyLang(b.dataset.lang));
  });
  if(DEMO){ demo(); return; }
  const timer = setTimeout(() => demo(), 1800);
  fetch("/api/health", {cache:"no-store"}).then(r => r.json()).then(h => {
    const eps = (h && h.endpoints) || [];
    if(eps.indexOf("pick") < 0) showStale();
  }).catch(() => demo()).finally(() => clearTimeout(timer));
}
const STATE = { path:"", unit:"", data:null };
boot();
</script>
</div>
</body></html>
